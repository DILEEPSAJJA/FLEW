<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="catAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2626" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff2626" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="capeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#a80e0e"/>
    </linearGradient>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff2626" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="120" cy="120" r="100" fill="url(#catAura)" />

  <!-- Cape -->
  <path d="M 70 120 C 40 160 30 215 50 230 C 80 200 95 180 120 190 C 145 180 160 200 190 230 C 210 215 200 160 170 120 Z" fill="url(#capeGrad)" />

  <!-- Cat Body -->
  <ellipse cx="120" cy="165" rx="42" ry="50" fill="#141416" stroke="#222" stroke-width="2"/>

  <!-- Cat Chest Emblem (Mini FLEW) -->
  <rect x="98" y="145" width="44" height="20" rx="10" fill="#ff2626" filter="url(#neonRed)"/>
  <text x="120" y="159" font-family="monospace" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">FLEW</text>

  <!-- Cat Head -->
  <!-- Left Ear -->
  <polygon points="80,95 62,35 102,68" fill="#18181b" stroke="#ff2626" stroke-width="2"/>
  <polygon points="80,90 68,48 96,70" fill="#ff2626" fill-opacity="0.6"/>

  <!-- Right Ear -->
  <polygon points="160,95 178,35 138,68" fill="#18181b" stroke="#ff2626" stroke-width="2"/>
  <polygon points="160,90 172,48 144,70" fill="#ff2626" fill-opacity="0.6"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="98" rx="48" ry="40" fill="#141416" stroke="#2a2a30" stroke-width="2"/>

  <!-- Red Hero Visor / Mask -->
  <path d="M 82 92 C 95 86 108 90 120 90 C 132 90 145 86 158 92 C 154 108 138 114 120 112 C 102 114 86 108 82 92 Z" fill="#ff2626" filter="url(#neonRed)"/>

  <!-- Eyes in Visor -->
  <ellipse cx="102" cy="98" rx="10" ry="4" fill="#ffffff" transform="rotate(-6 102 98)"/>
  <ellipse cx="138" cy="98" rx="10" ry="4" fill="#ffffff" transform="rotate(6 138 98)"/>
  <circle cx="102" cy="98" r="2.5" fill="#0c0c0e"/>
  <circle cx="138" cy="98" r="2.5" fill="#0c0c0e"/>

  <!-- Cute Cat Nose & Whiskers -->
  <polygon points="120,113 116,110 124,110" fill="#ff7777"/>
  <path d="M 120 113 Q 115 119 110 118 M 120 113 Q 125 119 130 118" stroke="#ff7777" stroke-width="1.5" fill="none"/>

  <!-- Whiskers Left -->
  <line x1="72" y1="108" x2="42" y2="102" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="114" x2="38" y2="116" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Whiskers Right -->
  <line x1="168" y1="108" x2="198" y2="102" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="168" y1="114" x2="202" y2="116" stroke="#ff4444" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Paws holding thickshake cup -->
  <ellipse cx="94" cy="180" rx="12" ry="9" fill="#1f1f23" stroke="#ff2626" stroke-width="1.5"/>
  <ellipse cx="146" cy="180" rx="12" ry="9" fill="#1f1f23" stroke="#ff2626" stroke-width="1.5"/>

  <!-- Paw pads -->
  <circle cx="94" cy="180" r="4" fill="#ff2626"/>
  <circle cx="146" cy="180" r="4" fill="#ff2626"/>
</svg>
